aid: advancedbiodevelopment
name: Advanced Bio Development
description: >-
  Advanced Bio Development, Inc. (ABD) was a New Jersey beverage and dietary-supplement company
  headquartered in Englewood Cliffs, NJ. It developed, produced and marketed X2PERFORMANCE, a
  patented all-natural liquid sports-energy supplement built around ATP, created by founder
  Dr. Ralph Ferrante as an alternative to conventional performance stimulants, and distributed in
  part through Anheuser-Busch InBev's AB ONE network. The company sold consumer packaged goods
  through retail and e-commerce; software was never its product and it never operated a developer
  program, public API, SDK or developer portal. In March 2023 X2 Performance merged into the
  Don't Quit! beverage platform — ABD and existing X2 investors became shareholders in Don't Quit!,
  X2 CEO Mark French took the same role at the combined company, and Keurig Dr Pepper remained
  majority owner — after which the X2 brand was wound down. The brand domain x2performance.com is
  no longer controlled by the company: WHOIS lists the registrant organization as HugeDomains.com
  and the site 302s to a domain-resale listing, while advancedbiodevelopment.com does not resolve.
  This record is retained as an honest zero — a consumer-packaged-goods company with no API
  surface, whose only remaining public presence is third-party listings.
